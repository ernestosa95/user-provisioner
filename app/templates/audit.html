{% extends "base.html" %}{% block body %}
<div class="card"><h1>Auditoría (últimos 200)</h1><table><tr><th>Fecha (UTC)</th><th>Admin</th><th>Acción</th><th>Objetivo</th><th></th><th>Detalle</th></tr>
{% for r in rows %}<tr><td>{{ r.ts }}</td><td>{{ r.admin }}</td><td>{{ r.action }}</td><td>{{ r.target or '' }}</td><td class="{{ 'ok' if r.ok else 'err' }}">{{ '✔' if r.ok else '✖' }}</td><td class="mut">{{ r.detail or '' }}</td></tr>{% endfor %}</table></div>{% endblock %}
