{% extends "base.html" %}{% block body %}
<div class="card"><h1>Ingresar</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}">
<p class="mut">Ingrese con su usuario y clave del dominio.</p>
<label>Usuario de dominio</label><input name="username" required autofocus autocomplete="username">
<label>Clave</label><input type="password" name="password" required autocomplete="current-password">
<p><button>Ingresar</button></p></form></div>{% endblock %}
