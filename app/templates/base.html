<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alta de usuarios</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><span class="brand">Alta de usuarios · {{ site }}</span>
{% if mode == 'demo' %}<span class="badge">MODO DEMO</span>{% endif %}
{% if user %}<nav><a href="/">Nuevo usuario</a><a href="/roles">Roles</a><a href="/audit">Auditoría</a>
{% if user.is_super %}<a href="/admins">Administradores</a><a href="/config">Configuración</a>{% endif %}</nav>
<span class="mut">{{ user.username }}</span>
<form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="sec">Salir</button></form>
{% endif %}</header><main>{% block body %}{% endblock %}</main></body></html>
